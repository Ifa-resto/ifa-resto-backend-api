name: API Test Suite CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    strategy:
      matrix:
        node-version: [18.x, 19.x, 20.x]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Run API tests
        run: npm test
        env:
          # Valeurs de test uniquement : l'API refuse de démarrer sans secrets JWT
          JWT_SECRET: ci-test-access-secret-0123456789
          JWT_REFRESH_SECRET: ci-test-refresh-secret-0123456789
