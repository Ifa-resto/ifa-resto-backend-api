name: Build and Deploy Backend
on:
  push:
    branches: ["main", "master"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Replace 'ifa-resto/backend' with your Dockerhub namespace and repository
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ifa-resto-backend:latest
          platforms: linux/amd64

      - name: Trigger Dokploy Deployment
        # You can use the webhook method if configured in Dockerhub, 
        # or use curl to trigger it directly via Dokploy API
        run: |
          if [ -n "${{ secrets.DOKPLOY_WEBHOOK_URL }}" ]; then
            curl -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}"
          fi
